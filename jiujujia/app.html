<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="backend.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>揪居家｜消費者端 APP</title>
<meta name="theme-color" content="#D4003C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#D4003C;--brand-soft:#FCE6EC;--brand-ink:#B80C40;
  --bg:#F2F2F3;--card:#FFFFFF;--ink:#2B2B29;--muted:#6B6A66;--line:#E6E5E1;
  --ok:#6E1A35;--ok-soft:#F3E4EA;--note:#FAF6EE;--page:#E4E3DF;
  --fs:15px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#F0476E;--brand-soft:#3A1A24;--brand-ink:#F7B8C9;--bg:#161616;--card:#232322;--ink:#EDEDEA;--muted:#A9A8A3;--line:#34332F;--ok:#E9A3B8;--ok-soft:#3A1A24;--note:#2A2620;--page:#0F0F0F;}}
:root[data-theme="dark"]{--brand:#F0476E;--brand-soft:#3A1A24;--brand-ink:#F7B8C9;--bg:#161616;--card:#232322;--ink:#EDEDEA;--muted:#A9A8A3;--line:#34332F;--ok:#E9A3B8;--ok-soft:#3A1A24;--note:#2A2620;--page:#0F0F0F;}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:var(--fs);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.shell{max-width:420px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:560px){body{padding:24px 0}.shell{height:calc(100% - 0px);max-height:880px;border-radius:32px;border:8px solid #2B2B29;box-shadow:0 20px 60px rgba(0,0,0,.18)}}
.ctl{max-width:900px;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:center;font-size:13px;padding:0 12px}
.ctl .lb{color:var(--muted)}.ctl #phl{font-weight:700;color:var(--ink)}
.ctl button{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:16px;padding:5px 12px;font-size:13px}
.ctl button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.ctl button:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:559px){body{display:flex;flex-direction:column}.ctl{flex:none;margin:0;padding:6px 10px;background:var(--ink);color:var(--bg)}.ctl .lb,.ctl #phl{color:var(--bg)}.shell{height:auto;flex:1;min-height:0}}
.tl2 .st{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.tl2 .st:first-child{border-top:0}
.tl2 .tm{width:44px;flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9em}
.tl2 .mk{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:var(--line);margin-top:1px}
.tl2 .done .mk{background:var(--ok)}.tl2 .cur .mk{background:var(--brand)}.tl2 .todo{opacity:.55}
.chain{display:flex;flex-direction:column;gap:4px}.chain div{display:flex;gap:8px;align-items:flex-start;font-size:.93em}.chain b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);font-size:12px;display:flex;align-items:center;justify-content:center}
.ribbon{background:var(--ink);color:var(--bg);font-size:12px;padding:5px 14px;display:flex;justify-content:space-between;align-items:center}
.ribbon button{font-size:12px;text-decoration:underline}
.top{background:var(--card);display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:52px}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
.back{color:var(--brand);font-size:22px;line-height:1;width:28px;height:28px}
.aplus{font-size:13px;border:1px solid var(--line);border-radius:14px;padding:3px 10px;color:var(--muted)}
.aplus[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px}
.card{background:var(--card);border-radius:14px;margin:0 12px 12px;padding:14px}
.sec{font-size:14px;font-weight:700;color:var(--muted);padding:14px 16px 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.chev{color:var(--brand);font-size:18px}
.tag{font-size:12px;padding:2px 9px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.btn{display:block;width:100%;text-align:center;background:var(--brand);color:#fff;border-radius:10px;padding:13px;font-weight:500;font-size:1.02em}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pad{padding:0 12px}
.muted{color:var(--muted);font-size:.9em}
.nav{background:#F1F1F1;border-top:1px solid #DCDCDC;display:flex;justify-content:space-around;padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;font-size:12px;color:#606060;gap:2px;min-width:56px}
.nav button[aria-current="page"]{color:var(--brand)}
.nav svg{width:22px;height:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;text-align:center;font-size:12px}
.grid .gi{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted)}
.gi .ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px}
.gi.hot{color:var(--brand);font-weight:500}
.gi.hot .ic{background:var(--brand-soft)}
.opt{display:block;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;font-size:1.08em}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);transition:width .25s}
.slot{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95em;background:var(--card)}
.slot[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.slot[data-fam],.slot[data-wcat]{display:inline-block}
.slot:disabled{opacity:.45;text-decoration:line-through}
.tabs{display:flex;background:var(--card);border-radius:22px;padding:3px;margin:12px}
.tabs button{flex:1;text-align:center;padding:8px;border-radius:19px;font-size:.95em;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--brand);color:#fff}
.hero-path{background:var(--note);border-radius:12px;padding:6px}
.role{display:block;width:100%;background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:1.5px solid var(--line)}
.role.on{border-color:var(--brand)}
.s3{display:flex;gap:4px;margin-top:8px}.s3>div{flex:1;min-width:0;border-radius:8px;padding:4px 6px;font-size:12px;line-height:1.35;background:var(--bg);color:var(--muted)}.s3>div b{display:block;font-size:13px}.s3 .dn{background:var(--ok-soft);color:var(--ok)}.s3 .cu{background:var(--brand);color:#fff}
.stp{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--brand-soft);color:var(--brand-ink);margin-left:6px;vertical-align:1px}
.c3 .row{align-items:flex-start;justify-content:flex-start;gap:8px}.c3 .n3{flex:none;color:var(--brand);font-weight:700}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%;width:max-content;text-align:center;z-index:20}
.toast.show{opacity:1}
.stf{background:var(--brand);color:#fff;display:flex;align-items:center;gap:8px;padding:11px 14px;min-height:50px}
.stf h1{font-size:16px;margin:0;flex:1;font-weight:700}
.stf .back{color:#fff}
.stf .clk{font-size:12px;background:rgba(255,255,255,.18);border-radius:10px;padding:2px 8px;font-variant-numeric:tabular-nums}
.step{font-size:13px;color:var(--muted);padding:10px 16px 4px}
.chip{display:inline-block;border:1.5px solid var(--line);border-radius:18px;padding:7px 13px;margin:0 6px 8px 0;font-size:.95em;background:var(--card)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.ly{background:var(--card);border-radius:12px;margin:0 12px 10px;padding:10px 12px}
.ly h3{margin:0 0 4px;font-size:.98em;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.it{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.ck{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.ck.on{background:var(--brand);border-color:var(--brand)}
.ck.later{border-style:dashed;border-color:#B80C40;color:#B80C40}
.rs{font-size:.84em;color:var(--muted)}
.rtag{font-size:11px;color:var(--brand-ink);background:var(--brand-soft);border-radius:8px;padding:1px 6px;margin-left:4px}
.warn{background:var(--brand-soft);color:var(--brand-ink);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.9em}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.9em}
.sum{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.sum .btn{width:auto;flex:1}
.fld{display:block;resize:vertical;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:var(--card);color:var(--ink);margin-top:4px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;text-align:center;padding:9px;font-size:.95em}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.arseg{margin:8px 0 0;background:rgba(255,255,255,.92);border-color:rgba(255,255,255,.92)}
.arseg button{color:var(--ink);font-weight:700}
.plan{display:block;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--card)}
.plan[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.chat{background:#F3D3DC;flex:1;overflow-y:auto;padding:14px 12px 16px}
:root[data-theme="dark"] .chat{background:#3A1A24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chat{background:#3A1A24}}
.lh{background:#8F0029;color:#fff;padding:11px 14px;display:flex;align-items:center;gap:8px;min-height:50px}
.lh .back{color:#fff}
.bub{background:var(--card);border-radius:16px;overflow:hidden;max-width:310px}
.bub .hd{padding:12px}
.ts{font-size:11px;color:#7A3C50;text-align:right;margin:4px 0 12px}
.sysnote{font-size:12px;color:#7A3C50;text-align:center;margin:6px 0 10px}
.sim{margin:14px 12px 0;border:1.5px dashed var(--muted);border-radius:12px;padding:10px 12px;background:var(--card)}
.sim b{font-size:.9em}
.tl{position:relative;padding-left:18px}
.tl div{position:relative;padding:4px 0 8px;font-size:.92em}
.tl div:before{content:"";position:absolute;left:-14px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.tl div:after{content:"";position:absolute;left:-11px;top:18px;bottom:-6px;width:2px;background:var(--line)}
.tl div:last-child:after{display:none}
.entry{display:flex;align-items:center;gap:12px;width:calc(100% - 24px);margin:10px 12px 12px;background:var(--card);border-radius:14px;padding:10px 14px;border:2px solid var(--brand);min-height:56px;text-align:left}
.entry .eh{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.entry .es{display:block;font-size:.86em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hintbar{background:var(--note);color:var(--muted);font-size:13px;padding:7px 14px;text-align:center;border-top:1px solid var(--line)}
.tip{background:#FCE6EC;color:#8F0029;font-size:13px;padding:8px 14px;border-bottom:1px solid #F3C7D3}
.adm td,.adm th{padding:6px 4px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:left}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.avt{width:46px;height:46px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2em;flex-shrink:0}
.big{font-size:1.45em;font-weight:700;line-height:1.3;margin:2px 0 6px}

/* 最小字級 13px（大字模式仍可放大） */
.rs,.muted,.step,.sysnote,.ts,.hintbar,.tip{font-size:max(13px,.9em)!important}
.tag{font-size:max(12px,.82em)!important}
[style*="font-size:.85em"],[style*="font-size:.86em"],[style*="font-size:.88em"],[style*="font-size:12px"],[style*="font-size:12.5px"],[style*="font-size:11px"]{font-size:max(13px,.9em)!important}

/* 上線版新增 */
.ld{display:flex;align-items:center;justify-content:center;flex:1;color:var(--muted);padding:40px 16px;text-align:center}
.err{color:var(--brand-ink);background:var(--brand-soft);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:.9em}
.err:empty{display:none}
.lgh{display:flex;gap:12px;align-items:center}.lgh .eh{width:46px;height:46px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.demo-accounts{border:1.5px dashed var(--muted);margin:14px 0 0}
.demo-accounts button{display:block;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--line)}
.demo-accounts button:first-of-type{margin-top:6px}
#envBadge{display:none!important;position:fixed;bottom:76px;left:6px;opacity:.9;z-index:60;background:#C23B5F;color:#fff;font-size:12px;border-radius:10px;padding:2px 10px;pointer-events:none}
.dot.lt{width:12px;height:12px;margin-right:8px;vertical-align:-1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.meas{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.mf{display:block;font-size:.9em;color:var(--muted)}.mf>span:first-child{display:block}
.unit{display:flex;align-items:center;gap:6px}.unit .fld{margin-top:4px;min-width:0}.unit i{font-style:normal;flex:none}
.agline{display:flex;align-items:center;gap:8px;margin-top:16px}.agav{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
select.fld{appearance:auto;-webkit-appearance:auto}
.slot[data-slot]{font-size:.92em;padding:10px 8px;line-height:1.35}
@media print{.top,.stf,.nav,.sum,.pad .btn,#envBadge{display:none!important}.shell{border:0!important;box-shadow:none!important;max-height:none!important;height:auto!important}}
/* AR 掃描（場勘）：沿用舊版文件的全螢幕相機畫面（模擬示範）＋手動輸入 */
.shell{width:100%}
.arv{position:relative;flex:1;width:100%;align-self:stretch;min-height:0;overflow:hidden;background:#2b2b29;container-type:size}
.arstage{position:absolute;left:50%;top:50%;width:max(100cqw,62.5cqh);height:max(100cqh,160cqw);transform:translate(-50%,-50%)}
.arstage img{position:absolute;inset:0;width:100%;height:100%;display:block}
.arstage .bgg{opacity:0}
.arsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.arlab{position:absolute;transform:translate(-50%,-50%) scale(.85);background:rgba(255,255,255,.96);color:#1f1f1f;font-weight:700;font-size:14px;border-radius:15px;padding:4px 11px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:0;transition:opacity .25s,transform .25s}
.arlab.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.arlab i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.ardot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25);opacity:0}
.reticle{position:absolute;left:50%;top:62%;width:56px;height:56px;margin:-28px 0 0 -28px;border:2px solid rgba(255,255,255,.92);border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.12)}
.reticle:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff}
.artop{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.arhead,.arprog{background:rgba(58,58,56,.78);color:#fff;border-radius:14px}
.arhead{display:flex;align-items:center;gap:8px;padding:9px 12px}
.arhead .back{color:#fff;width:22px;height:22px;font-size:22px;line-height:1}
.arhead b{flex:1;font-size:16px}
.artag{font-size:12px;background:#FCE6EC;color:#8F0029;border-radius:10px;padding:2px 9px;white-space:nowrap}
.arprog{padding:8px 12px 9px;font-size:13px}
.arprog .r{display:flex;justify-content:space-between}
.arprog .pb{height:6px;background:rgba(255,255,255,.28);border-radius:3px;margin-top:6px;overflow:hidden}
.arprog .pb i{display:block;height:100%;width:0;background:#F48FAA;border-radius:3px}
.archips{display:flex;gap:6px;flex-wrap:wrap}
.archips span{font-size:13px;border-radius:15px;padding:5px 11px;background:rgba(58,58,56,.78);color:#fff;white-space:nowrap}
.archips .go{background:#E0A030}
.archips .ok{background:#6E1A35}
.arsheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:12px 12px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.arseg{display:flex;gap:6px;margin-bottom:8px}
.arseg span{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:6px 2px;font-size:.9em;color:var(--muted)}
.arseg .dn{background:var(--ok-soft);color:var(--ok);border-color:#BFD9B3}
.arseg .cu{background:var(--brand-soft);color:var(--brand);border-color:var(--brand);font-weight:700}
.arres .row{padding:6px 0}
.arnote{font-size:.86em;color:var(--muted);margin-bottom:8px;line-height:1.5}
.arlink{display:block;width:100%;text-align:center;color:var(--brand);font-size:.95em;padding:9px 0 2px}
.armode{margin:10px 12px 0}
.cmp .hpw,.cmpw{position:relative;margin-top:8px;border-radius:10px;overflow:hidden;background:#F6F3EE;user-select:none;-webkit-user-select:none}
.cmpw .cmpa{position:absolute;inset:0;clip-path:inset(0 0 0 var(--p))}.cmpw .cmpa img{display:block;width:100%}
.cmph{position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
.cmph span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#D4003C;border-radius:16px;padding:3px 9px;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap}
.cmpt{position:absolute;top:8px;font-size:12px;font-weight:700;background:rgba(0,0,0,.62);color:#fff;border-radius:10px;padding:2px 9px;pointer-events:none}.cmpt.l{left:8px}.cmpt.r{right:8px;background:#D4003C}

 return r.length?r:[['目前沒有明顯風險','家電檔案：保固與換季提醒']]}

function obsLights(o){const L=[];

 L.push(['門口','g','無明顯風險']);return L}
