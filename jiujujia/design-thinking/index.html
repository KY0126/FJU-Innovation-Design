:root{
  --bg:#F1F1F1; --paper:#FFFFFF; --ink:#303030; --muted:#585C64; --line:#DCDCDC;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --red:#FF4D7A; --red-tint:#3A1A24; --chip:#2A292E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18171A; --paper:#222125; --ink:#ECEAEE; --muted:#A9A6AE; --line:#38363C;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:920px;margin:0 auto}
header{padding-block:40px 24px;display:grid;gap:10px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted)}
.eyebrow b{color:var(--red);font-weight:700}
h1{font-size:clamp(30px,6vw,46px);line-height:1.2;font-weight:900;margin:0;text-wrap:balance}
.lead{margin:0;max-width:40em;color:var(--ink)}
.meta{font-size:14px;color:var(--muted)}
.idx{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px}
.idx h2{font-size:15px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.04em}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stage{display:grid;gap:8px;align-content:start;min-width:0}
.stage .name{font-weight:700;font-size:15px;color:var(--red);border-bottom:2px solid var(--red);padding-bottom:4px}
.stage a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.45;padding:6px 8px;border-radius:8px;background:var(--chip)}
.stage a:hover{background:var(--red-tint)}
.stage a:focus-visible,.pages a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
.pg{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pages{display:grid;gap:28px;margin-top:28px}
figure{margin:0;display:grid;gap:8px;scroll-margin-top:16px}
figcaption{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
figure img{width:100%;max-width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.note{font-size:13px;color:var(--muted);margin-top:28px}
@media (max-width:640px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head><body>
